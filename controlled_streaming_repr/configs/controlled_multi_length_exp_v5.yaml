experiment_name: controlled_multi_length_exp_v5
scene_id: scene0002
sequence_total_length: 128
stride: 1
token_type: image_tokens
extract_last_frame_only: true
layers: [4, 11, 17, 23]

project:
  name: controlled_multi_length_exp_v5
  output_root: outputs
  random_seed: 2026
  path_mode: absolute

data:
  dataset_name: scannet
  scannet_root: from_data_scannet_config
  env_var: SCANNET_RAW_ROOT
  scene_ids:
    - scene0002_00
  max_scenes: 1
  require_color: true
  require_depth: true
  require_pose: true
  require_intrinsic: true

sequence:
  seq_lens: [128]
  settings:
    controlled_multi_length:
      enabled: true
      experiment_name: controlled_multi_length_exp_v5
      scene_id: scene0002
      sequence_total_length: 128
      stride: 1
      start_frame_ids: [0, 128, 256]
      token_type: image_tokens
      extract_last_frame_only: true
      layers: [4, 11, 17, 23]

extraction:
  models:
    - lingbot-map
  python_executable: ${LINGBOT_PYTHON:-python}
  device: cuda
  save_tokens_dtype: float16
  save_raw_attention: false
  save_attention_summary: true
  save_geometry_outputs: true
  skip_existing: true
  token_slice: patch
  layers: [4, 11, 17, 23]
  use_sdpa: true
  num_scale_frames: 8
  camera_num_iterations: 4
  keyframe_interval: 1
  kv_cache_sliding_window: 64
  max_frame_num: 1024

smoke_test:
  layers: [17]
  sequences: [seg000_B1, seg000_X, seg001_B1, seg001_X, seg002_B1, seg002_X]
  methods: [multi_length_delta]
