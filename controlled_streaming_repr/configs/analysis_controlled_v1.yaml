analysis:
  methods:
    - "frame_gram"
    - "token_drift"
    - "shared_pca_patchmap"
    - "patch_affinity"
    - "attention_mass"
    - "geometry_stability"

  token_types:
    - "patch_tokens"
    - "camera_tokens"
    - "register_tokens"
    - "memory_tokens"
    - "d1_stage0_patch_tokens"

  layer_selection:
    mode: "aliases_or_all"
    aliases:
      visual_reference: "d1_stage0"
      shallow: null
      middle: null
      deep: null

  figures:
    dpi: 180
    save_png: true
    save_pdf: false
    max_frames_for_contact_sheet: 12

  runtime:
    skip_missing: true
    max_conditions_per_scene: null

  patch_affinity:
    max_patches_per_frame: 1024

  shared_pca_patchmap:
    pca_max_samples: 50000
    map_resolution: "pixel"
    upsample_mode: "bilinear"
    frame_selection: "lingbot_memory_phases"
    num_scale_frames: 8
    kv_cache_sliding_window: 64
