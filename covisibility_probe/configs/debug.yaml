run:
  tag: debug
  seed: 42
  device: cuda
  output_root: outputs
  run_id: null

paths:
  scannet_root: auto
  lingbot_repo: ../lingbot-map
  lingbot_checkpoint: ../lingbot-map/checkpoints/lingbot-map.pt
  dinov2_repo: ../dinov2
  dinov2_checkpoint: ../weights/dinov2/dinov2_vitl14_reg4_pretrain.pth
  vggt_repo: ../vggt

dataset:
  num_scenes: 2
  frames_per_scene: 80
  raw_frame_stride: 5
  preferred_debug_scenes: [scene0000_00, scene0002_00]
  allow_fewer_scenes: true
  allow_fewer_frames: true

model:
  natural_order: true
  image_size: 518
  patch_size: 14
  local_window: 32
  num_scale_frames: 8
  video_rope: true
  adaptive_keyframe_selection: false
  keyframe_interval: 1
  reset_state: false
  use_sdpa: true
  camera_num_iterations: 4
  save_predicted_pose: false
  max_frame_num: 1024

features:
  layers: [4, 11, 17, 23]
  dtype: float16
  batch_size: 4
  extract_official_dino: true
  extract_lingbot_backbone: true
  extract_camera_token: true
  extract_attention_k_debug: false

overlap:
  depth_scale: 1000.0
  pixel_stride: 4
  voxel_size: 0.05
  sensitivity_voxel_sizes: [0.03, 0.05, 0.10]
  reprojection_audit_pairs: 100
  depth_abs_tol_m: 0.05
  depth_rel_tol: 0.05
  pose_convention: camera_to_world

analysis:
  local_window: 32
  anchor_frame_count: 8
  time_gap_bins: [[33, 48], [49, 64], [65, 96], [97, null]]
  overlap_bins: [[0.0, 0.05], [0.05, 0.15], [0.15, 0.30], [0.30, 1.0]]
  bootstrap_iterations: 1000
  ndcg_k: 5
  representative_layer: 17

visualization:
  enabled: true
  max_retrieval_cases: 6

