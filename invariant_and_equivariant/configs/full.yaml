run_name: full_v1
paths_config: configs/paths.yaml
output_dir: outputs/full_v1
seed: 17
device: cuda
precision: bfloat16
input_size: 224
patch_size: 14
representation_space: raw
splits:
  train: [scene_000, scene_001, scene_002, scene_003, scene_004, scene_005, scene_006, scene_007]
  validation: [scene_008, scene_009]
  test: [scene_010, scene_011]
selection:
  scenes: [scene_000, scene_001, scene_002, scene_003, scene_004, scene_005, scene_006, scene_007, scene_008, scene_009, scene_010, scene_011]
  position_indices: all
  cameras: all
pooling:
  method: area_weighted
  min_mask_area_ratio: 0.005
  min_patch_coverage: 0.35
  min_effective_patches: 1.5
features:
  force: false
  save_patch_tokens: true
  dtype: float16
models:
  dinov2:
    enabled: true
    config: configs/models/dinov2.yaml
    layers: [block_05, block_11, block_17, block_last]
    batch_size: 4
  vggt:
    enabled: true
    config: configs/models/vggt.yaml
    layers: [aggregator_block_04, aggregator_block_11, aggregator_block_17, aggregator_block_last]
    views_per_state: 12
analysis:
  ridge_alphas: [0.0001, 0.001, 0.01, 0.1, 1.0, 10.0, 100.0]
  coordinate_systems: [ref, current, world]
  main_coordinate_system: ref
  subspace_rank: 2
  effective_rank_threshold: 0.05
  random_subspace_repeats: 20
  random_seed: 17
composition:
  primitive_tags: [horizontal, vertical, short-distance]
  composite_pair_types: [diagonal, two-step, medium-distance, random_valid_pair]

